name: Build Blog

on:
  push:
    paths:
      - "blog/posts/**"
      - "scripts/build_blog.py"
  workflow_dispatch: {}      # allow manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mistune
        run: pip install mistune

      - name: Build blog pages
        run: python3 scripts/build_blog.py

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/*.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Build blog pages [skip ci]"
            git push
          fi
